apiVersion: apps/v1
kind: Deployment
metadata:
  name: openchat-frontend
  namespace: openchat
  labels:
    app: openchat-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: openchat-frontend
  template:
    metadata:
      labels:
        app: openchat-frontend
    spec:
      containers:
      - name: frontend
        image: openchat-frontend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: NEXT_PUBLIC_API_URL
          value: "http://openchat-backend:8000"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: openchat-frontend
  namespace: openchat
spec:
  selector:
    app: openchat-frontend
  ports:
  - port: 3000
    targetPort: 3000
    name: http
  type: ClusterIP
