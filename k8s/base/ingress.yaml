apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openchat-ingress
  namespace: openchat
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - openchat.example.com
    secretName: openchat-tls
  rules:
  - host: openchat.example.com
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: openchat-backend
            port:
              number: 8000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: openchat-frontend
            port:
              number: 3000
